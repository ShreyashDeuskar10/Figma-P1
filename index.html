<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Ludo</h1>

      <div class="layout">
        <div id="board" class="board"></div>

        <aside class="panel">
          <p id="status" class="status">Red's turn</p>

          <button id="dice" class="dice" type="button">Roll</button>

          <ul id="scores" class="scores"></ul>

          <p class="hint">
            Roll a 6 to move a token out of its base. Click a highlighted token
            to move it. A 6, a capture or a token reaching home earns another
            roll.
          </p>

          <button id="reset" class="reset" type="button">New game</button>
        </aside>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
